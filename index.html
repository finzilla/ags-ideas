<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AGS — Вход</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',sans-serif;background:#0A1638;color:#0A1638;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:12px;padding:32px 28px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.logo{display:block;height:34px;margin:0 auto 20px}
h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
p.sub{font-size:13px;color:#6B7280;text-align:center;margin-bottom:22px}
label{display:block;font-size:12px;font-weight:600;color:#6B7280;margin-bottom:6px}
input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid #E5E7EB;border-radius:6px;margin-bottom:14px;outline:none}
input:focus{border-color:#8B6A4E;box-shadow:0 0 0 3px rgba(139,106,78,.18)}
button{width:100%;font:inherit;font-size:15px;font-weight:600;padding:11px;border:0;border-radius:6px;background:#8B6A4E;color:#fff;cursor:pointer}
button:hover{background:#7A5C42}button:disabled{opacity:.6;cursor:wait}
.err{min-height:18px;font-size:13px;color:#DC2626;text-align:center;margin-top:12px}
.remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#6B7280;margin:-4px 0 16px}
.remember input{width:auto;margin:0}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <img class="logo" src="assets/logo-dark.png" alt="AGS" onerror="this.remove()">
  <h1>Карта инвестиционных идей</h1>
  <p class="sub">Введите логин и пароль</p>
  <label for="u">Логин</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Пароль</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <label class="remember"><input type="checkbox" id="r" checked> Не спрашивать до закрытия вкладки</label>
  <button id="b" type="submit">Войти</button>
  <div class="err" id="e"></div>
</form>

const K = 'ags_k';
const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const e64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function derive(user, pass) {
  const base = await crypto.subtle.importKey('raw',
    new TextEncoder().encode(user.trim().toLowerCase() + '\n' + pass), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:d64(P.s), iterations:P.i}, base, 512);
}

async function open(bits) {
  bits = new Uint8Array(bits);
  const iv = d64(P.v), c = d64(P.c);
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  const data = new Uint8Array(iv.length + c.length); data.set(iv); data.set(c, iv.length);
  if (!await crypto.subtle.verify('HMAC', macKey, d64(P.m), data)) return null;
  const encKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv}, encKey, c));
}

function show(html) { document.open(); document.write(html); document.close(); }

(async () => {
  let saved = null; try { saved = sessionStorage.getItem(K); } catch (_) {}
  if (saved) {
    const html = await open(d64(saved)).catch(() => null);
    if (html) return show(html);
    try { sessionStorage.removeItem(K); } catch (_) {}
  }
})();

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Проверка…'; e.textContent = '';
  try {
    const bits = await derive(document.getElementById('u').value, document.getElementById('p').value);
    const html = await open(bits);
    if (!html) throw 0;
    if (document.getElementById('r').checked) { try { sessionStorage.setItem(K, e64(bits)); } catch (_) {} }
    show(html);
  } catch (_) {
    e.textContent = 'Неверный логин или пароль';
    b.disabled = false; b.textContent = 'Войти';
    document.getElementById('p').select();
  }
});
</script>
